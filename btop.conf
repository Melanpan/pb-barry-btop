#? btop settings for the Barry Launcher app, copied to its data folder on
#? first start. btop adds every other setting with its default and keeps
#? what you change in its options menu (o).

#* Truecolor: the app draws 24-bit colour.
truecolor = true

#* Draw btop's own background, so its theme shows as designed.
theme_background = true

rounded_corners = true

#* Braille graphs need the most from the font; they look best on the Thor's screen.
graph_symbol = "braille"

#* Milliseconds between updates: once a second, as often as the app draws when idle.
update_ms = 1000

#* Process list: sorted by CPU, the busiest first, without jumping around.
proc_sorting = "cpu lazy"
proc_tree = false

#* Taps on the screen are mouse clicks.
vim_keys = false
